packages:
  - packages/*

# pnpm 11 reads this from here, not from .npmrc.
linkWorkspacePackages: true

# Only esbuild may run build scripts: yaz0's node-gyp breaks on Windows and the
# PC-seed pipeline never needs it (full ROM builds: devcontainer or manual build).
allowBuilds:
  '@parcel/watcher': false
  bufferutil: false
  es5-ext: false
  esbuild: true
  microtime: false
  netlify-cli: false
  nx: false
  sharp: false
  unix-dgram: false
  utf-8-validate: false
  yaz0: false

catalog:
  '@preact/preset-vite': ^2.10.5
  '@tailwindcss/vite': ^4.2.2
  '@types/lodash-es': ^4.17.12
  lodash-es: ^4.18.1
  preact: ^10.29.1
  react-icons: ^5.6.0
  tailwindcss: ^4.2.2
  type-fest: ^5.5.0
  yaml: ^2.8.3

patchedDependencies:
  yaz0@4.0.2: patches/yaz0@4.0.2.patch
